<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>💚🌾ขวัญใจ BSCM FOODS🌾💚</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:
    linear-gradient(
      rgba(255,255,255,0.2),
      rgba(200,230,201,0.6)
    ),
    url("rice-field.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#ffffffee;
  padding:30px;
  border-radius:20px;
  width:100%;
  max-width:420px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h1{
  text-align:center;
  color:#2e7d32;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:25px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#66bb6a;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#43a047;
}

.thanks{
  text-align:center;
  font-size:18px;
  color:#2e7d32;
}
</style>
</head>

<body>

<div class="box" id="formBox">
  <h1>💚 ขวัญใจชาวบีฟูดส์ 💚</h1>

  <form id="voteForm">
    <label>ชื่อเล่น</label>
    <input type="text" required name="entry.337906428">

    <label>แผนก</label>
    <select required name="entry.866714438">
      <option value="">-- เลือกแผนก --</option>
      <option>บุคคล HR</option>
      <option>วางแผนและขนส่ง MP/LG</option>
      <option>จัดซื้อ PC</option>
      <option>วิจัยและพัฒนาผลิตภัณฑ์ R&D</option>
      <option>ขายและการตลาด SA</option>
      <option>ควบคุมและประกันคุณภาพ QC&QA</option>
      <option>ผลิต PD</option>
      <option>วิศวกรรม EN</option>
      <option>คลัง WH</option>
    </select>

    <label>ตำแหน่งงาน / ห้องปฏิบัติงาน เช่น ห้องแพค</label>
    <input type="text" required name="entry.186685424">

    <button type="submit">💚 ส่งคะแนนโหวต</button>
  </form>
</div>

<script>
document.getElementById("voteForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  fetch("https://docs.google.com/forms/d/e/1FAIpQLSdkoVU4SinQHuazQO2LVjIiKfpKfDAlLldfqwmUaRxJqSLMLQ/formResponse", {
    method: "POST",
    mode: "no-cors",
    body: formData
  }).then(() => {
    document.getElementById("formBox").innerHTML = `
      <div class="thanks">
        💚🌾<br><br>
        ขอบคุณที่ร่วมสนุกนะคะ!<br>
        คะแนนโหวตของคุณถูกส่งเรียบร้อยแล้ว ✨😊
      </div>
    `;
  });
});
</script>

</body>
</html>
